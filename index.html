<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Boot error catcher: show errors on screen (mobile has no console). Watchdog: game.ts sets __booted.
        // __quiet (overlay.ts): a store / portal build past its first frame shows players no red bar.
        (function () {
            function show(msg) {
                if (window.__quiet) return;
                var d = document.getElementById('boot-err');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'boot-err';
                    d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:12px;background:#a00;color:#fff;font:14px monospace;white-space:pre-wrap;z-index:9999';
                    (document.body || document.documentElement).appendChild(d);
                }
                d.textContent += msg + '\n';
            }
            window.onerror = function (m, src, line) { show('Error: ' + m + ' (' + src + ':' + line + ')'); };
            // Capture phase: resource load errors (<script>/<img>) don't bubble and never reach onerror.
            window.addEventListener('error', function (e) {
                var t = e.target, url = t && (t.src || t.href);
                if (!url || t === window || /^(VIDEO|AUDIO|SOURCE)$/.test(t.tagName)) return;
                show('Failed to load: ' + url);
            }, true);
            window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
            // Past the portals' init limit (storage.ts INIT_MS, 15 s).
            setTimeout(function () { if (!window.__booted) show('Game did not start in 20 s. Try reloading.'); }, 20000);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Antfall</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Load time: phaser and the font start with the html, not after it. The sheets are preloaded by boot.ts once phaser is in. -->
    <link rel="preload" as="script" href="phaser.min.js">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/nunito-latin-800.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/nunito-latin-ext-800.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/nunito-cyrillic-800.woff2">
    <style>
        /* Nunito ExtraBold (OFL, via fontsource): Latin + Latin Ext + Cyrillic cover all 8 languages. boot.ts awaits it. */
        @font-face { font-family: Nunito; font-weight: 800; font-display: block; src: url(assets/fonts/nunito-latin-800.woff2) format('woff2');
            unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
        @font-face { font-family: Nunito; font-weight: 800; font-display: block; src: url(assets/fonts/nunito-latin-ext-800.woff2) format('woff2');
            unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
        @font-face { font-family: Nunito; font-weight: 800; font-display: block; src: url(assets/fonts/nunito-cyrillic-800.woff2) format('woff2');
            unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { background: #05070d; overflow: hidden; touch-action: none; }
        #game { position: relative; z-index: 1; width: 100%; height: 100vh; height: 100dvh; }
        /* Blurred copy of the game behind the letterbox bars, Playgama builds only (game.ts creates and fills it). */
        #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) brightness(0.6); transform: scale(1.1); }
        /* Loading screen: the logo bobbing till the nest is up (base.ts fades it out). */
        #splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 4vh; align-items: center; justify-content: center; background: #05070d; z-index: 10; transition: opacity 0.4s; }
        #splash img { width: min(80vw, 900px); animation: bob 1.6s ease-in-out infinite; }
        /* Loading bar under the logo (base.ts preload fills #bar): a slow phone shows it is moving. */
        #load { width: min(60vw, 420px); height: 10px; border-radius: 5px; background: #1c2233; overflow: hidden; }
        #bar { width: 3%; height: 100%; background: #e8b04a; transition: width 0.3s; }
        @keyframes bob { 50% { transform: translateY(-2%) scale(1.02); } }
    </style>
</head>
